<main class="register-shell">
  <section class="register-card" aria-labelledby="register-title">
    <div class="brand-pane" aria-hidden="true">
      <div class="brand-mark">
        <ng-icon [svg]="shieldIcon" size="26"></ng-icon>
      </div>

      <div class="preview-stack">
        <div class="chat-bubble incoming">Tham gia AMATECH</div>
        <div class="chat-bubble outgoing">Tạo tài khoản của bạn</div>
        <div class="typing-bubble"><i></i><i></i><i></i></div>
      </div>
    </div>

    <form class="register-form app-scrollbar" (ngSubmit)="submit()" novalidate>
      <div class="form-heading">
        <img class="identity-mark" src="assets/img.png" alt="" aria-hidden="true" />
        <div>
          <p>AMATECH</p>
          <h1 id="register-title">Đăng ký</h1>
        </div>
      </div>

      <div class="fields-grid">
        <label
          class="field"
          [class.is-active]="activeField() === 'fullName'"
          [class.has-error]="touched() && fullName().trim().length === 0"
        >
          <span>Họ và tên</span>
          <div class="input-wrap">
            <ng-icon [svg]="userAltIcon" size="19"></ng-icon>
            <input
              name="fullName"
              autocomplete="name"
              placeholder="Nhập họ và tên đầy đủ"
              [ngModel]="fullName()"
              (ngModelChange)="fullName.set($event)"
              (focus)="activeField.set('fullName')"
              (blur)="activeField.set(null)"
            />
          </div>
        </label>

        <label
          class="field"
          [class.is-active]="activeField() === 'username'"
          [class.has-error]="touched() && username().trim().length === 0"
        >
          <span>Tài khoản</span>
          <div class="input-wrap">
            <ng-icon [svg]="userIcon" size="19"></ng-icon>
            <input
              name="username"
              autocomplete="username"
              placeholder="Nhập tên đăng nhập"
              [ngModel]="username()"
              (ngModelChange)="username.set($event)"
              (focus)="activeField.set('username')"
              (blur)="activeField.set(null)"
            />
          </div>
        </label>

        <label
          class="field"
          [class.is-active]="activeField() === 'email'"
          [class.has-error]="touched() && email().trim().length === 0"
        >
          <span>Email</span>
          <div class="input-wrap">
            <ng-icon [svg]="emailIcon" size="19"></ng-icon>
            <input
              name="email"
              type="email"
              autocomplete="email"
              placeholder="Nhập địa chỉ email"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              (focus)="activeField.set('email')"
              (blur)="activeField.set(null)"
            />
          </div>
        </label>

        <label
          class="field"
          [class.is-active]="activeField() === 'phoneNumber'"
        >
          <span>Số điện thoại <em class="optional">(tùy chọn)</em></span>
          <div class="input-wrap">
            <ng-icon [svg]="phoneIcon" size="19"></ng-icon>
            <input
              name="phoneNumber"
              type="tel"
              autocomplete="tel"
              placeholder="Nhập số điện thoại"
              [ngModel]="phoneNumber()"
              (ngModelChange)="phoneNumber.set($event)"
              (focus)="activeField.set('phoneNumber')"
              (blur)="activeField.set(null)"
            />
          </div>
        </label>

        <label
          class="field password-field"
          [class.is-active]="activeField() === 'password'"
          [class.has-error]="touched() && password().trim().length === 0"
        >
          <span>Mật khẩu</span>
          <div class="input-wrap">
            <ng-icon [svg]="lockIcon" size="19"></ng-icon>
            <input
              name="password"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="Nhập mật khẩu"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              (focus)="activeField.set('password')"
              (blur)="activeField.set(null)"
            />
            <button
              class="password-toggle"
              type="button"
              [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
              (click)="showPassword.set(!showPassword())"
            >
              <ng-icon [svg]="passwordIcon()" size="18"></ng-icon>
            </button>
          </div>
        </label>

        <label
          class="field password-field"
          [class.is-active]="activeField() === 'confirmPassword'"
          [class.has-error]="passwordMismatch()"
        >
          <span>Xác nhận mật khẩu</span>
          <div class="input-wrap">
            <ng-icon [svg]="lockIcon" size="19"></ng-icon>
            <input
              name="confirmPassword"
              [type]="showConfirmPassword() ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="Nhập lại mật khẩu"
              [ngModel]="confirmPassword()"
              (ngModelChange)="confirmPassword.set($event)"
              (focus)="activeField.set('confirmPassword')"
              (blur)="activeField.set(null)"
            />
            <button
              class="password-toggle"
              type="button"
              [attr.aria-label]="showConfirmPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
              (click)="showConfirmPassword.set(!showConfirmPassword())"
            >
              <ng-icon [svg]="confirmPasswordIcon()" size="18"></ng-icon>
            </button>
          </div>
        </label>
      </div>

      <div class="feedback-box error-box" [class.is-visible]="hasError()" [attr.aria-hidden]="!hasError()">
        <p role="alert">{{ errorMessage() }}</p>
      </div>

      <div class="feedback-box success-box" [class.is-visible]="hasSuccess()" [attr.aria-hidden]="!hasSuccess()">
        <p role="status">{{ successMessage() }}</p>
      </div>

      <app-loading-button
        class="submit-button"
        type="submit"
        [block]="true"
        [loading]="isSubmitting()"
        [disabled]="!canSubmit()"
      >
        <span>{{ isSubmitting() ? "Đang xử lý" : "Đăng ký" }}</span>
        @if (!isSubmitting()) {
          <ng-icon [svg]="registerIcon" size="19" aria-hidden="true"></ng-icon>
        }
      </app-loading-button>

      <p class="auth-link">
        Đã có tài khoản?
        <button type="button" class="auth-link-btn" (click)="goToLogin.emit()">Đăng nhập ngay</button>
      </p>
    </form>
  </section>
</main>
