<main class="login-shell">
  <section class="login-card" aria-labelledby="login-title">
    <div class="brand-pane" aria-hidden="true">
      <div class="brand-mark">
        <ng-icon [svg]="shieldIcon" size="26"></ng-icon>
      </div>

      <div class="preview-stack">
        <div class="chat-bubble incoming">AMATECH Internal Chat</div>
        <div class="chat-bubble outgoing">Protected access</div>
        <div class="typing-bubble"><i></i><i></i><i></i></div>
      </div>
    </div>

    <form class="login-form" (ngSubmit)="submit()" novalidate>
      <div class="form-heading">
        <img class="identity-mark" src="assets/img.png" alt="" aria-hidden="true" />
        <div>
          <p>AMATECH</p>
          <h1 id="login-title">Đăng nhập</h1>
        </div>
      </div>

      <label
        class="field"
        [class.is-active]="activeField() === 'username'"
        [class.has-error]="touched() && username().trim().length === 0"
      >
        <span>Tài khoản</span>
        <div class="input-wrap">
          <ng-icon [svg]="userIcon" size="19"></ng-icon>
          <input
            name="username"
            autocomplete="off"
            placeholder="Nhập tài khoản nhân viên"
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
            (focus)="activeField.set('username')"
            (blur)="activeField.set(null)"
          />
        </div>
      </label>

      <label
        class="field password-field"
        [class.is-active]="activeField() === 'password'"
        [class.has-error]="touched() && password().trim().length === 0"
      >
        <span>Mật khẩu</span>
        <div class="input-wrap">
          <ng-icon [svg]="lockIcon" size="19"></ng-icon>
          <input
            name="password"
            autocomplete="current-password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="Nhập mật khẩu của bạn"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            (focus)="activeField.set('password')"
            (blur)="activeField.set(null)"
          />
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            (click)="showPassword.set(!showPassword())"
          >
            <ng-icon [svg]="passwordIcon()" size="18"></ng-icon>
          </button>
        </div>
      </label>

      <label class="remember-row">
        <input
          type="checkbox"
          name="rememberDevice"
          role="switch"
          [attr.aria-checked]="rememberDevice()"
          [ngModel]="rememberDevice()"
          (ngModelChange)="rememberDevice.set($event)"
        />
        <span class="toggle-track" aria-hidden="true">
          <span class="toggle-thumb">
            <ng-icon [svg]="monitorIcon" size="13"></ng-icon>
          </span>
        </span>
        <span>Ghi nhớ thiết bị này</span>
      </label>

      <div class="login-error" [class.is-visible]="hasError()" [attr.aria-hidden]="!hasError()">
        <p role="alert">{{ errorMessage() }}</p>
      </div>

      <app-loading-button
        class="submit-button"
        type="submit"
        [block]="true"
        [loading]="isSubmitting()"
        [disabled]="!canSubmit()"
      >
        <span>{{ isSubmitting() ? "Đang xác thực" : "Đăng nhập" }}</span>
        @if (!isSubmitting()) {
          <ng-icon [svg]="loginIcon" size="19" aria-hidden="true"></ng-icon>
        }
      </app-loading-button>

      <p class="auth-link">
        Chưa có tài khoản?
        <button type="button" class="auth-link-btn" (click)="goToRegister.emit()">Đăng ký ngay</button>
      </p>
    </form>
  </section>
</main>
