<div class="popover-layer" [class.is-open]="open()" [attr.aria-hidden]="!open()">
  <div class="popover-backdrop" (click)="close()"></div>

  <section class="notification-popover" aria-label="Thông báo" (click)="$event.stopPropagation()">
    <header class="popover-header">
      <h3>Thông báo</h3>
      <button class="icon-button" type="button" aria-label="Đóng" (click)="close()">
        <ng-icon [svg]="closeIcon" size="20"></ng-icon>
      </button>
    </header>

    <div class="popover-tabs">
      @for (tab of tabs; track tab.value) {
        <button
          class="tab-btn"
          [class.active]="activeTab() === tab.value"
          (click)="switchTab(tab.value)"
        >
          {{ tab.label }}
        </button>
      }
    </div>

    <div class="popover-body">
      @if (filteredNotifications().length === 0) {
        <div class="empty-state">Không có thông báo nào.</div>
      } @else {
        <div class="notification-list">
          @for (item of filteredNotifications(); track item.id) {
            <div class="notification-item" [class.unread]="!item.read">
              <div class="item-content">
                <strong>{{ item.title }}</strong>
                <p>{{ item.message }}</p>
                <span class="time">{{ item.time }}</span>
              </div>
              @if (!item.read) {
                <button class="mark-read-btn" type="button" title="Đánh dấu đã đọc" (click)="markAsRead(item.id)">
                  <ng-icon [svg]="checkIcon" size="18"></ng-icon>
                </button>
              }
            </div>
          }
        </div>
      }
    </div>
  </section>
</div>
